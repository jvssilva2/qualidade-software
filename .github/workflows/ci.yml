name: CI - SQA Social Media

# Dispara em todo PR aberto/atualizado com destino à main (e em push na main)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas do mesmo PR quando um novo commit chega
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. Testes de caixa-branca da API (JUnit + Mockito + MockMvc)
  # ---------------------------------------------------------------
  api-unit-tests:
    name: API - Testes unitários/integração (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executar testes (usa H2 em memória)
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Publicar relatório Surefire
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-surefire-report
          path: api/target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. Testes de caixa-branca do Client (Jest + Testing Library) + build
  # ---------------------------------------------------------------
  client-unit-tests:
    name: Client - Testes unitários/integração (Jest) + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Jest
        run: npm test -- --ci

      - name: Build (lint + type check)
        run: npm run build

  # ---------------------------------------------------------------
  # 3. Testes de caixa-preta (Playwright E2E + API) com app rodando
  # ---------------------------------------------------------------
  e2e-tests:
    name: E2E + API (Playwright)
    runs-on: ubuntu-latest
    needs: [api-unit-tests, client-unit-tests]
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/sqa_social_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      NEXT_PUBLIC_BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      # --- Ambiente ---
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            playwright/package-lock.json

      # --- Dependências ---
      - name: Instalar dependências do client
        working-directory: client
        run: npm ci

      - name: Instalar dependências do Playwright
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # --- Subir aplicação ---
      - name: Build e start da API (porta 8080)
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/*.jar > ../api.log 2>&1 &
          npx --yes wait-on@8 -t 120000 tcp:127.0.0.1:8080

      - name: Build e start do client (porta 3000)
        working-directory: client
        run: |
          npm run build
          nohup npm run start > ../client.log 2>&1 &
          npx --yes wait-on@8 -t 120000 http://localhost:3000

      # --- Testes ---
      - name: Executar testes Playwright
        working-directory: playwright
        run: npx playwright test

      # --- Evidências ---
      - name: Logs da API e do client (em caso de falha)
        if: failure()
        run: |
          echo "===== API =====";    tail -n 200 api.log    || true
          echo "===== CLIENT =====";  tail -n 100 client.log || true

      - name: Publicar relatório Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7
