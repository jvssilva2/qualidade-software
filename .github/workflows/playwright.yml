name: CI Pipeline - SQA Social Media

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configuração dos Ambientes
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            playwright/package-lock.json

      # 2. Testes unitários do Backend (Java)
      - name: Run backend tests
        working-directory: ./api
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/sqa_social_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          chmod +x ./mvnw
          ./mvnw test

      # 3. Testes unitários e BUILD do Frontend (Next.js)
      - name: Install, test and build client
        working-directory: ./client
        run: |
          npm ci
          npm run test
          npm run build

      # 4. Inicialização da API Spring Boot
      - name: Start backend API
        working-directory: ./api
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/sqa_social_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          ./mvnw spring-boot:run &
          echo "Aguardando API na porta 8080..."
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 2; done' || true

      # 5. Instalação e Testes do Playwright (E2E / API)
      - name: Install Playwright dependencies
        working-directory: ./playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./playwright
        run: npx playwright test

      # 6. Relatório dos testes
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30