name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            playwright/package-lock.json

      # 1. Execução dos testes unitários da Atividade 2
      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run client unit tests (Atividade 2)
        working-directory: ./client
        run: npm run test

      # 2. Execução dos testes E2E e API da Atividade 3
      - name: Install Playwright dependencies
        working-directory: ./playwright
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Atividade 3)
        working-directory: ./playwright
        run: npx playwright test

      # 3. Publicação do relatório do Playwright em caso de falha/sucesso
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30